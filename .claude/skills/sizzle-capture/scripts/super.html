<!doctype html>
<!-- A super (on-screen caption) as a transparent 1920x1080 layer: Fredoka SemiBold, bottom-left, Caramel bar under it.
     Rendered by super.sh with headless Edge. Params in the hash: #text=...&theme=latte|espresso -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(Fredoka.ttf); font-weight: 300 700; }
html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
#wrap { position: relative; width: 1920px; height: 1080px; }
#super { position: absolute; left: 96px; bottom: 110px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 60px; white-space: nowrap; }
#bar { position: absolute; left: 96px; bottom: 86px; width: 86px; height: 7px; border-radius: 4px; background: #e0954a; }
</style></head>
<body><div id="wrap"><div id="bar"></div><div id="super"></div></div>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const s = document.getElementById('super');
s.textContent = p.get('text') || 'Super text';
s.style.color = p.get('theme') === 'espresso' ? '#fbefe2' : '#3b2620';
</script></body></html>

<!doctype html>
<!-- End card frame (clip 17): the brand lockup centred on the theme background. #theme=latte|espresso
     Rendered by end-card.sh with headless Edge; the logos are copied next to this file by the script. -->
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; overflow: hidden; }
#wrap { position: relative; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; }
.latte { background: linear-gradient(#fff8ef, #ead8c3); }
.espresso { background: linear-gradient(#2a1e19, #160f0d); }
img { width: 900px; height: auto; display: block; }
</style></head>
<body><div id="wrap"><img id="logo" alt="Freppuccino"></div>
<script>
const theme = new URLSearchParams(location.hash.slice(1)).get('theme') === 'espresso' ? 'espresso' : 'latte';
document.getElementById('wrap').className = theme;
document.getElementById('logo').src = theme === 'espresso' ? 'frepuccino-lockup-dark.svg' : 'frepuccino-lockup.svg';
</script></body></html>
